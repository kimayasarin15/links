<!DOCTYPE html>
<html>
    <head>
        <title>Links</title>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <link href="reset.css" rel="stylesheet">
        <link href="style.css" rel="stylesheet">
        <script defer src="assets/arena.js"></script>
        <script defer src="script.js"></script>
    </head>
	<body>
		<header>
            <!-- I exported these icons from the iconify plugin on figma -->
           <button id="play">
            <svg id="play-icon" width="11" height="14" viewBox="0 0 11 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M0 0V14L11 7L0 0Z"/>
            </svg>
            <svg id="pause-icon" width="12" height="14" viewBox="0 0 12 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 14V0H12V14H8ZM0 14V0H4V14H0Z"/>
            </svg>
        </button>
			<div id="playing"> <h1 id="channel-title"></h1> </div>
           <section class="web-buttons">
                <a href="#main-section">
                    <p class="buttontext">extended mix below</p>
                </a>
            </section>
		</header>
		<main id="main-section">
            <!-- I got this to work as the channel slug from arena instead of writing it out! I defined the variable just like the others-->
            <h2 id="channel-slug"></h2>
            <section class="togglebuttons">
                <button class="modal-button">????</button>
            <dialog class="modal-dialog">
            <section class="topbar-end">
                    <button class="close-button">✕</button>
                </section>
                <section id="channel-description"></section>
                <a class="arena-button" id="channel-link">view on are.na</a>
            </dialog>
            <button class="modal-button"id="togglebutton">a-side</button>
            </section>
				<ul id="channel-blocks"></ul>
			</section>
            <section class="bottom-back">
                <section class="web-buttons">
                    <a href="#">
                        <p class="buttontext">back to top</p>
                    </a>
                </section>
            </section>
		</main>
		<footer>
            <p>by <a href="https://kimayasarin15.github.io/">Kimaya Sarin</a></p>
            <p>ft. <a href="https://sooimkang07.github.io/">Sooim Kang</a></p>
		</footer>
	</body>
</html>
